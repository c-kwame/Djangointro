{% extends 'master.html' %}
{% load static %}

{% block title %} About {% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-8">
                <table class="table">
                    <tr>
                        <th>Name</th>
                        <th>English</th>
                        <th>Maths</th>
                        <th>Chemistry</th>
                        <th>Biology</th>
                        <th>Total</th>
                    </tr>
                    {% for score in scores %}
                        <tr>
                            <td>{{ score.names }}</td>
                            <td>{{ score.english }}</td>
                            <td>{{ score.maths }}</td>
                            <td>{{ score.chemistry }}</td>
                            <td>{{ score.biology }}</td>
                            <td></td>
                        </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
{% endblock %}
